<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sync App</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f0f2f5; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 320px; }
    input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-bottom: 8px; }
    button:hover { background: #0056b3; }
    button.secondary { background: #6c757d; }
    button.secondary:hover { background: #5a6268; }
    button.danger { background: #dc3545; }
    button.danger:hover { background: #bd2130; }
    .hidden { display: none !important; }
    .error { color: red; font-size: 14px; margin-bottom: 10px; }
    .success { color: green; font-size: 14px; margin-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #007bff; color: white; }
    tr:nth-child(even) { background-color: #f2f2f2; }
  </style>
</head>
<body>

  <!-- Экран Входа / Регистрации -->
  <div id="authScreen" class="card hidden">
    <h2 id="authTitle">Вход в систему</h2>
    <div id="msgBox"></div>
    
    <input type="text" id="usernameInput" placeholder="Имя пользователя...">
    <input type="password" id="passwordInput" placeholder="Пароль...">

    <button id="authPrimaryBtn">Войти</button>
    <button id="toggleAuthBtn" class="secondary">Нет аккаунта? Зарегистрироваться</button>
  </div>

  <!-- Экран Приложения -->
  <div id="mainScreen" class="card hidden">
    <h3 id="welcomeMsg">Привет!</h3>
    <input type="number" id="numInput" placeholder="Введите ваше число...">
    <button id="pushBtn">PUSH</button>
    <button id="logoutBtn" class="danger">Выйти из аккаунта</button>

    <h4>Онлайн таблица</h4>
    <table>
      <thead>
        <tr>
          <th>Пользователь</th>
          <th>Число</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    const socket = io();

    let isLoginMode = true;
    let myUsername = "";

    const authScreen = document.getElementById('authScreen');
    const mainScreen = document.getElementById('mainScreen');
    const authTitle = document.getElementById('authTitle');
    const msgBox = document.getElementById('msgBox');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const authPrimaryBtn = document.getElementById('authPrimaryBtn');
    const toggleAuthBtn = document.getElementById('toggleAuthBtn');
    
    const welcomeMsg = document.getElementById('welcomeMsg');
    const numInput = document.getElementById('numInput');
    const pushBtn = document.getElementById('pushBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const tableBody = document.getElementById('tableBody');

    // 1. МГНОВЕННАЯ ПРОВЕРКА СЕССИИ ПРИ ЗАГРУЗКЕ СТРАНИЦЫ (до подключения сети)
    const savedUserJson = localStorage.getItem('sync_user');
    let savedUser = null;

    if (savedUserJson) {
      try {
        savedUser = JSON.parse(savedUserJson);
        myUsername = savedUser.username;
        welcomeMsg.innerText = "Вы вошли как: " + myUsername;
        mainScreen.classList.remove('hidden'); // Сразу открываем главный экран!
      } catch (e) {
        localStorage.removeItem('sync_user');
        authScreen.classList.remove('hidden');
      }
    } else {
      authScreen.classList.remove('hidden'); // Покажем форму входа только если авторизации нет
    }

    // 2. ФОНОВОЕ ПОДКЛЮЧЕНИЕ И СИНХРОНИЗАЦИЯ
    socket.on('connect', () => {
      if (savedUser) {
        socket.emit('login', { username: savedUser.username, password: savedUser.password });
      }
    });

    // Переключение режима Вход / Регистрация
    toggleAuthBtn.addEventListener('click', () => {
      isLoginMode = !isLoginMode;
      msgBox.innerHTML = "";
      if (isLoginMode) {
        authTitle.innerText = "Вход в систему";
        authPrimaryBtn.innerText = "Войти";
        toggleAuthBtn.innerText = "Нет аккаунта? Зарегистрироваться";
      } else {
        authTitle.innerText = "Регистрация";
        authPrimaryBtn.innerText = "Зарегистрироваться";
        toggleAuthBtn.innerText = "Уже есть аккаунт? Войти";
      }
    });

    // Нажатие Войти / Зарегистрироваться
    authPrimaryBtn.addEventListener('click', () => {
      const username = usernameInput.value;
      const password = passwordInput.value;
      msgBox.innerHTML = "";

      if (isLoginMode) {
        socket.emit('login', { username, password });
      } else {
        socket.emit('register', { username, password });
      }
    });

    // Если пароль изменился или сессия невалидна - возвращаем на экран входа
    socket.on('auth_error', (msg) => {
      localStorage.removeItem('sync_user');
      mainScreen.classList.add('hidden');
      authScreen.classList.remove('hidden');
      msgBox.innerHTML = `<div class="error">${msg}</div>`;
    });

    // Успешная регистрация
    socket.on('auth_success', (data) => {
      msgBox.innerHTML = `<div class="success">${data.message}</div>`;
      isLoginMode = true;
      authTitle.innerText = "Вход в систему";
      authPrimaryBtn.innerText = "Войти";
      toggleAuthBtn.innerText = "Нет аккаунта? Зарегистрироваться";
      passwordInput.value = "";
    });

    // Успешный вход
    socket.on('login_success', (data) => {
      myUsername = data.username;
      
      const userObj = {
        username: usernameInput.value || (savedUser && savedUser.username),
        password: passwordInput.value || (savedUser && savedUser.password)
      };

      localStorage.setItem('sync_user', JSON.stringify(userObj));

      welcomeMsg.innerText = "Вы вошли как: " + myUsername;
      authScreen.classList.add('hidden');
      mainScreen.classList.remove('hidden');
      renderTable(data.tableData);
    });

    // Выход из аккаунта
    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('sync_user');
      location.reload();
    });

    // Нажатие PUSH
    pushBtn.addEventListener('click', () => {
      socket.emit('push_data', numInput.value);
    });

    // Обновление таблицы
    socket.on('update_table', (usersData) => {
      renderTable(usersData);
    });

    function renderTable(usersData) {
      tableBody.innerHTML = "";
      for (const [name, val] of Object.entries(usersData)) {
        const row = document.createElement('tr');
        row.innerHTML = `<td><b>${name}</b></td><td>${val}</td>`;
        tableBody.appendChild(row);
      }
    }
  </script>
</body>
</html>
